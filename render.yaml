services:
  - type: web
    name: ereto-namunyak
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    initialDeployHook: npm run seed:admin
    disk:
      name: uploaded-media
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ereto-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: ereto-db
    databaseName: ereto
    user: ereto
    plan: 0.1c-256mb
    region: frankfurt
