services:
  - type: web
    name: ereto-namunyak
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    initialDeployHook: npm run seed:admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ereto-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: ereto-db
    databaseName: ereto
    user: ereto
    plan: free
    region: frankfurt
